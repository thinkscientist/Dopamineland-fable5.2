name: Publish to gh-pages

# Mirrors the site to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main, claude/lucid-curie-rusknj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:refs/heads/gh-pages
